server {
    listen 80;

    # Sirve el frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxea al backend de ventas
    location /api/v1/ventas {
        rewrite ^(.*)/$ $1 break;
        proxy_pass http://10.0.20.61:8081;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxea al backend de despachos
    location /api/v1/despachos {
        rewrite ^(.*)/$ $1 break;
        proxy_pass http://10.0.20.61:8080;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
